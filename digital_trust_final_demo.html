:root{--navy:#11263b;--ink:#17314a;--muted:#64778a;--line:#dce5ed;--bg:#eef3f7;--teal:#087f76;--green:#087b60;--amber:#a76412;--red:#b63c46}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}button,input{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.42}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #34a9d2;outline-offset:3px}header{background:var(--navy);color:white;padding:13px 32px;display:flex;justify-content:space-between;align-items:center;gap:20px}.brand{display:flex;align-items:center;gap:13px}.logo{width:42px;height:42px;border:1px solid #71949c;border-radius:12px;display:grid;place-items:center;color:#9de0c9;font-size:25px;font-weight:800}.brand h1{font-size:21px;line-height:1.15;margin:0;letter-spacing:-.5px}.brand small{color:#b7c8d5;font-size:12px}.header-right{display:flex;gap:12px;align-items:center}.demo-tag{font-size:11px;letter-spacing:1.5px;color:#b4d6d3}.ghost{background:transparent;color:inherit;border:1px solid #8399ac;border-radius:7px;padding:7px 12px}.wrap{max-width:1600px;margin:auto;padding:18px 30px 12px}.timeline{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin-bottom:14px}.step{background:#fff;border:1px solid var(--line);border-radius:9px;padding:10px 11px;text-align:left;color:var(--ink);min-height:65px}.step small{display:block;font-size:10px;color:var(--muted);font-weight:700;letter-spacing:.6px}.step b{font-size:13px}.step.active{background:#d9eeec;border-color:#56a89f;box-shadow:inset 0 -3px var(--teal)}.nav{display:flex;align-items:center;gap:7px;margin-bottom:13px;border-bottom:1px solid #c9d7e2}.tab{border:0;background:transparent;color:#64778a;padding:11px 18px 13px;font-weight:700;border-bottom:3px solid transparent}.tab.active{color:var(--teal);border-bottom-color:var(--teal)}.nav .spacer{flex:1}.nav .ghost{font-size:12px;color:var(--muted);margin-bottom:6px}.layout{display:grid;grid-template-columns:minmax(0,2.15fr) minmax(295px,1fr);gap:15px}.panel{background:white;border:1px solid var(--line);border-radius:14px;padding:20px;min-width:0}.eyebrow{font-size:10px;letter-spacing:1.65px;font-weight:800;color:var(--teal);text-transform:uppercase}h2{font-size:28px;line-height:1.14;letter-spacing:-.9px;margin:8px 0 10px}h3{font-size:16px;margin:0 0 10px}p{margin:0 0 10px}.sub{color:var(--muted);font-size:13px}.main{min-height:470px}.side{min-height:470px;display:flex;flex-direction:column;gap:9px}.side h3{margin:0}.metric{font-size:37px;font-weight:750;letter-spacing:-1.5px;line-height:1.1}.tiny{font-size:11px;color:var(--muted)}.pill{display:inline-block;border-radius:99px;padding:5px 10px;font-weight:750;font-size:11px;letter-spacing:.6px;background:#e9eff4;color:#526b80}.pill.ok{color:var(--green);background:#d9f2e9}.pill.hold{color:var(--amber);background:#fff0d6}.pill.bad{color:var(--red);background:#ffe6e8}.status{padding:13px 14px;background:#f3f6f9;border-radius:10px}.status.ok{background:#e8f7f0}.status.hold{background:#fff5e3}.status.bad{background:#fff0f1}.status strong{display:block;font-size:18px;margin:5px 0}.divider{border-top:1px solid var(--line);margin:0}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.primary{border:0;background:var(--teal);color:white;border-radius:8px;font-weight:700;padding:11px 17px}.secondary{border:1px solid #c3d2df;background:white;color:var(--ink);border-radius:8px;padding:10px 15px;font-weight:650}.danger{border:1px solid #e9b8bd;background:#fff2f2;color:var(--red);border-radius:8px;padding:10px 15px;font-weight:700}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.hero{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:center;min-height:390px}.hero .big{font-size:78px;letter-spacing:-6px;font-weight:800;color:var(--teal);line-height:1}.hero h2{font-size:34px}.stack{display:grid;gap:10px}.card{padding:14px;background:#f4f7fa;border:1px solid #e3eaf1;border-radius:10px}.card b{display:block;margin-bottom:3px}.flow{display:flex;align-items:center;gap:7px;margin:15px 0 6px}.flow div{flex:1;padding:11px 8px;text-align:center;background:#eef3f7;border:1px solid #dbe4ec;border-radius:8px;font-size:12px;font-weight:700;min-width:0}.flow div.on{background:#d8efeb;border-color:#7bc1b6;color:#07675e}.flow span{color:#91a4b6}.consumer{display:grid;grid-template-columns:255px 1fr;gap:24px;align-items:start}.phone{border:5px solid #172c40;border-radius:28px;overflow:hidden;min-height:366px;background:#f0f3f6;box-shadow:0 8px 18px #1b385016;position:relative}.phonehead{background:#163d53;color:white;padding:17px 13px 12px}.phonehead b{font-size:14px}.phonehead small{display:block;color:#b7d5df;font-size:10px}.phonebody{padding:13px}.bubble{background:white;border:1px solid #e0e6ec;border-radius:11px;padding:11px;margin:0 0 9px;font-size:13px}.bubble.user{background:#dff0e9;border-color:#c7e8d7;margin-left:20px}.bubble.assistant{margin-right:12px}.phone-foot{font-size:10px;color:#738698;text-align:center;padding:0 10px 12px}.amount{font-size:47px;font-weight:780;letter-spacing:-2px;line-height:1.05;margin:8px 0}.details{display:grid;gap:9px;margin-top:13px}.details .row{padding-bottom:7px;border-bottom:1px solid #edf0f3;font-size:13px}.checklist{display:grid;gap:7px;margin:12px 0}.check{display:grid;grid-template-columns:24px 1fr auto;gap:8px;align-items:center;padding:10px 11px;border:1px solid #e0e7ed;border-radius:8px;font-size:13px}.check .mark{font-weight:800;font-size:17px}.check small{display:block;color:var(--muted);font-size:11px}.mark.ok{color:var(--green)}.mark.hold{color:var(--amber)}.mark.bad{color:var(--red)}.check code{font-size:10px;color:#677d90}.note{font-size:12px;color:var(--muted);padding:10px 12px;border-left:3px solid #a5bbcb;background:#f5f8fa}.ledger{display:grid;grid-template-columns:1fr 1fr;gap:8px}.ledger>div{padding:10px;border:1px solid var(--line);border-radius:9px}.ledger b{font-size:22px;display:block}.ledger small{font-size:11px;color:var(--muted)}.log{max-height:108px;overflow:auto;display:grid;gap:6px}.event{font-size:11px;display:flex;gap:8px;align-items:start}.event time{color:#8295a5;font-variant-numeric:tabular-nums;flex:none}.event strong{font-weight:650}.empty{color:#9aa8b4;font-size:12px}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:12px}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid #e1e8ee;vertical-align:top}th{color:#64788b;font-size:10px;text-transform:uppercase;letter-spacing:.5px}a{color:#087f76;text-decoration:none}a:hover{text-decoration:underline}.replay{border:1px solid #c8dedb;background:#f0f8f6;padding:12px;border-radius:10px;margin-top:12px}.replay input{width:100%;accent-color:var(--teal)}.replay-results{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:8px}.replay-results div{padding:8px;background:white;border:1px solid #dce9e6;border-radius:7px;font-size:11px}.replay-results b{display:block;margin-bottom:4px}.outro{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:25px}.outro .card{min-height:150px}.outro .card strong{font-size:23px;display:block;color:var(--teal);margin-bottom:10px}.footer{display:flex;align-items:center;justify-content:space-between;color:#64788b;font-size:11px;margin-top:12px;gap:15px}.footer a{font-size:11px}.pulse{animation:pop .35s ease-out}@keyframes pop{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}@media(max-width:1000px){.wrap{padding:12px}.layout{grid-template-columns:1.6fr 1fr}.consumer{grid-template-columns:1fr}.phone{max-width:310px}.timeline{grid-template-columns:repeat(3,1fr)}.hero{grid-template-columns:1fr}.outro{grid-template-columns:1fr}}@media(max-width:690px){header{padding:14px}.header-right .demo-tag{display:none}.layout{grid-template-columns:1fr}.tab{padding:9px;font-size:12px}.nav .ghost{display:none}.panel{padding:14px}.hero .big{font-size:60px}.footer{flex-direction:column;align-items:flex-start}.timeline .step{min-height:50px}.side{min-height:auto}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body><header><div class="brand"><div class="logo">T</div><div><h1>TrustBridge</h1><small>Digital Trust &amp; Programmable Controls · FIS Hackathon</small></div></div><div class="header-right"><span class="demo-tag">SIMULATION · NO LIVE FUNDS</span><button class="ghost" id="full">⛶ Full screen</button></div></header><main class="wrap"><div class="timeline" id="timeline" aria-label="Pitch scenes"></div><nav class="nav" aria-label="Role views"><button class="tab active" data-tab="consumer">01 &nbsp; Consumer</button><button class="tab" data-tab="business">02 &nbsp; Business Console</button><button class="tab" data-tab="audit">03 &nbsp; Audit &amp; Regulator</button><div class="spacer"></div><button class="ghost" id="reset">Reset demo</button></nav><div class="layout"><section class="panel main" id="main" aria-live="polite"></section><aside class="panel side" id="side" aria-live="polite"></aside></div><div class="footer"><span>Prototype · Synthetic firms, wallets &amp; GBP-pegged stablecoin · Shared demo funding pool</span><div><button class="secondary" id="prev">← Previous</button> <button class="primary" id="next">Next scene →</button></div></div></main><script>
'use strict';
const scenes=[['0:00–0:40','Problem'],['0:40–1:20','01 · Normal payment'],['1:20–2:20','02 · Clone site'],['2:20–3:50','03 · Held for review'],['3:50–4:30','Audit & policy replay'],['4:30–5:00','Commercial value']];
const cases={1:{id:'TX-001',name:'Everyday purchase',merchant:'Northstar Books (fictional)',domain:'northstar-books.example',amount:45,verified:true,clone:false,newWallet:false,intent:'Pay £45 for my order.',risk:'Low',wallet:'W-104 · established'},2:{id:'TX-002',name:'Clone website',merchant:'Northstar Finance (fictional)',domain:'northstar-finance-pay.example',amount:350,verified:false,clone:true,newWallet:false,intent:'Pay £350 to this investment firm.',risk:'High',wallet:'W-104 · established'},3:{id:'TX-003',name:'High-value purchase',merchant:'Harbour Electronics (fictional)',domain:'harbour-electronics.example',amount:2400,verified:true,clone:false,newWallet:true,intent:'Pay £2,400 for my new laptop.',risk:'Elevated',wallet:'W-209 · new wallet'}};
const baseline=2000;let scene=0,tab='consumer',records={},events=[],funds=3000,reserved=0,paid=0,limit=baseline,runToken=0;const $=id=>document.getElementById(id);const money=n=>'£'+n.toLocaleString('en-GB');const stamp=()=>new Date().toLocaleTimeString('en-GB',{hour12:false});function log(id,msg){events.push({t:stamp(),id,msg});}function current(){return cases[scene]||null;}function rec(){return current()?records[scene]:null;}function label(s){return ({idle:'NOT SUBMITTED',checking:'CHECKING',settled:'APPROVED · SETTLED',blocked:'BLOCKED',held:'HELD FOR REVIEW',rejected:'REJECTED'})[s]||'NOT SUBMITTED';}function tone(s){return s==='settled'?'ok':s==='held'||s==='checking'?'hold':s==='blocked'||s==='rejected'?'bad':'';}function rule(c,l=baseline){return c.clone?'BLOCK':c.amount>=l?'HOLD':'APPROVE';}function setScene(n){if(n<0||n>5)return;scene=n;tab=n===4?'audit':'consumer';render();}function setTab(t){if(t!=='audit'&&!current()&&(scene===4||t==='business'))scene=Object.keys(records).length?Math.max(...Object.keys(records).map(Number)):1;tab=t;render();}function run(){let c=current();if(!c||rec())return;const n=scene,token=runToken,started=performance.now();records[n]={state:'checking',reason:'Verifying identity and payment evidence',review:false};log(c.id,'Request received · policy v1.0');render();setTimeout(()=>{if(token!==runToken)return;let r=records[n];if(!r||r.state!=='checking')return;const d=rule(c);log(c.id,c.clone?'Firm contact/domain mismatch; partner wallet binding mismatch':'Merchant and wallet evidence matched (synthetic)');if(d==='BLOCK'){r.state='blocked';r.reason='Claimed firm contact/domain and verified wallet binding do not match.';log(c.id,'R-01 / R-02 · BLOCK · no transfer');}else if(funds-reserved<c.amount){r.state='blocked';r.reason='Insufficient available simulated balance.';log(c.id,'R-04 · BLOCK · insufficient funds');}else if(d==='HOLD'){r.state='held';r.reason='Amount meets review threshold; new wallet adds risk.';reserved+=c.amount;log(c.id,'R-03 · HOLD · '+money(c.amount)+' reserved in simulated escrow');}else{r.state='settled';r.latency=Math.round(performance.now()-started);r.reason='Verified merchant and wallet; all demo controls passed.';funds-=c.amount;paid+=c.amount;log(c.id,'APPROVE · partner check passed · simulated transfer confirmed');}render();},480);}
function evidence(){let r=rec();if(!r||r.state!=='held')return;r.review=true;log(current().id,'Reviewer verified additional synthetic wallet and customer evidence');render();}function approve(){let c=current(),r=rec();if(!r||r.state!=='held'||!r.review||c.clone||funds<c.amount||reserved<c.amount)return;reserved-=c.amount;funds-=c.amount;paid+=c.amount;r.state='settled';r.reason='Independent reviewer approved after additional evidence; partner released reserved funds.';log(c.id,'Reviewer A · approved under v1.0');log(c.id,'Final check passed · reserved funds released · receipt SIM-003');render();}function reject(){let c=current(),r=rec();if(!r||r.state!=='held')return;reserved-=c.amount;r.state='rejected';r.reason='Reviewer rejected; reservation returned to available balance.';log(c.id,'Reviewer A · rejected · reservation released to payer');render();}function reset(){runToken++;scene=0;tab='consumer';records={};events=[];funds=3000;reserved=0;paid=0;limit=baseline;render();}
function pill(s){return `<span class="pill ${tone(s)}">${label(s)}</span>`;}function check(mark,title,sub,code){return `<div class="check"><span class="mark ${mark}">${mark==='ok'?'✓':mark==='bad'?'×':mark==='hold'?'!':'○'}</span><div><b>${title}</b><small>${sub}</small></div><code>${code}</code></div>`;}
function problem(){return `<div class="eyebrow">The problem · UK payment fraud</div><div class="hero"><div><div class="big">£316m</div><h2>Lost to APP scams<br>in H1 2026.</h2><p class="sub">Up 22% year on year. Not a stablecoin-specific loss figure.</p><a class="tiny" href="https://www.ukfinance.org.uk/policy-and-guidance/reports/half-year-fraud-report-2026" target="_blank" rel="noopener">UK Finance · Half Year Fraud Report · 24 Nov 2026 ↗</a></div><div class="stack"><div class="card"><b>Customer sees the website.</b><span class="sub">Limited context on the recipient and payment risk.</span></div><div class="card"><b>Institution sees the payment.</b><span class="sub">May lack upstream context and evidence.</span></div><div class="card" style="background:#e2f2ef;border-color:#a6d2ca"><b>TrustBridge connects both.</b><span class="sub">Shared evidence, programmable controls, clear feedback.</span></div><button class="primary" onclick="setScene(1)">Start the demo →</button></div></div>`;}
function flow(s){return `<div class="flow"><div class="${s!=='idle'?'on':''}">Intent</div><span>→</span><div class="${s!=='idle'?'on':''}">Trust</div><span>→</span><div class="${s!=='idle'&&s!=='checking'?'on':''}">Control</div><span>→</span><div class="${s==='settled'?'on':''}">Settlement</div></div>`;}
function consumer(c,r){let s=r?.state||'idle';let msg=s==='idle'?'I can help check the payment and guide your next step.':s==='checking'?'Checking the recipient and payment conditions…':s==='settled'?'Your payment is complete. A simulated receipt is ready.':s==='blocked'&&c.clone?'This site may be copying Northstar Finance. Its contact details do not match our simulated FCA record. The recipient wallet also fails the partner check. Do not pay.':s==='held'?'Your payment is being checked. Target review time: 15 minutes (demo only). Your funds are reserved, not paid to the merchant.':s==='rejected'?'The payment was rejected. Your reserved funds have been returned.':r.reason;return `<div class="eyebrow">Consumer experience · Scene 0${scene}</div><h2>${c.name}</h2><div class="consumer"><div class="phone"><div class="phonehead"><b>TrustBridge Assistant</b><small>Agent / browser companion · simulated</small></div><div class="phonebody"><div class="bubble user">${c.intent}</div><div class="bubble assistant">${msg}</div>${s==='settled'?'<div class="bubble assistant"><span class="pill ok">✓ PAYMENT COMPLETE</span><br><small>Receipt: SIM-'+c.id.slice(-3)+'</small></div>':''}${s==='held'?'<div class="bubble assistant"><b>What happens next?</b><br>Independent review. We will update this screen.</div>':''}</div><div class="phone-foot">No private chat or financial credentials accessed</div></div><div><span class="pill">GBP-PEGGED STABLECOIN · SIM</span><div class="amount">${money(c.amount)}</div><p><b>${c.merchant}</b></p><div class="details"><div class="row"><span>Website</span><b>${c.domain}</b></div><div class="row"><span>Payment</span><b>${pill(s)}</b></div><div class="row"><span>Funds to merchant</span><b>${money(s==='settled'?c.amount:0)}</b></div>${r?.latency?`<div class="row"><span>Local simulation time</span><b>${r.latency} ms</b></div>`:''}</div>${flow(s)}<div class="actions"><button class="primary" onclick="run()" ${s!=='idle'?'disabled':''}>${s==='idle'?'Check & pay':'Payment checked'}</button><button class="secondary" onclick="setTab('business')">View business console →</button></div><p class="tiny" style="margin-top:10px">Customer authority and partner checks are simulated. A green status is not a guarantee of merchant safety.</p></div></div>`;}
function business(c,r){let s=r?.state||'idle',done=s!=='idle'&&s!=='checking',m=done?(c.clone?'bad':'ok'):'';return `<div class="eyebrow">Financial institution · Decision console</div><div class="row"><h2>${c.id} · ${money(c.amount)}</h2>${pill(s)}</div><p class="sub">Policy v1.0 · ${c.wallet} · ${done?c.risk:'Risk not yet evaluated'}</p><div class="checklist">${check(m,'Firm / merchant identity',c.clone?'Claimed regulated firm: domain/contact mismatch (mock FCA record)':'Partner merchant credentials match (synthetic)','R-01')}${check(m,'Recipient wallet binding',c.clone?'Recipient wallet differs from partner-verified binding':'Wallet binding matches partner evidence','R-02')}${check(done?(c.amount>=baseline?'hold':'ok'):'','Amount & wallet risk',`${money(c.amount)} · review threshold ${money(baseline)} · ${c.newWallet?'new wallet':'established wallet'}`,'R-03')}${check(done?(s==='blocked'&&!c.clone?'bad':'ok'):'','Payment state & funds','Simulated ledger; no release without valid approval','R-04')}</div><div class="note">${r?.reason||'Submit the transaction to run the control checks.'}</div><div class="actions">${s==='idle'?'<button class="primary" onclick="run()">Run checks</button>':''}${s==='held'?`<button class="secondary" onclick="evidence()" ${r.review?'disabled':''}>${r.review?'✓ Evidence verified':'Verify additional evidence'}</button><button class="primary" onclick="approve()" ${r.review?'':'disabled'}>Approve & release</button><button class="danger" onclick="reject()">Reject</button>`:''}<button class="secondary" onclick="setTab('consumer')">Consumer view</button><button class="secondary" onclick="setTab('audit')">Audit view</button></div>`;}
function audit(){return `<div class="eyebrow">Governance · Evidence, not a live regulator feed</div><h2>Every decision has a trace.</h2><div class="table-wrap"><table><thead><tr><th>Rule / version</th><th>Control</th><th>Basis / source</th></tr></thead><tbody><tr><td>R-01 / v1.0</td><td>Block clone mismatch</td><td><a href="https://www.fca.org.uk/consumers/clone-firms-individuals" target="_blank" rel="noopener">FCA clone-firm guidance ↗</a></td></tr><tr><td>R-02 / v1.0</td><td>Match recipient wallet</td><td>Partner credential policy · not FCA Register data</td></tr><tr><td>R-03 / v1.0</td><td>Review ≥ £2,000</td><td>Illustrative internal risk policy · not a legal threshold</td></tr><tr><td>R-04 / v1.0</td><td>Enforce approved transfer</td><td>Internal policy · <a href="https://www.bis.org/project/mandala" target="_blank" rel="noopener">BIS Mandala design reference ↗</a></td></tr></tbody></table></div><div class="replay"><div class="row"><b>Policy replay · proposed v1.1</b><b id="lim">${money(limit)}</b></div><input aria-label="Proposed review threshold" type="range" min="25" max="3000" step="25" value="${limit}" oninput="replay(this.value)"><div class="row tiny"><span>£25</span><span>Review threshold · sandbox only</span><span>£3,000</span></div><div class="replay-results" id="replay-results"></div><p class="tiny" style="margin:8px 0 0">Replay changes hypothetical decisions only. Production v1.0, historical outcomes and balances remain unchanged. Deployment requires approval.</p></div><div class="actions"><button class="secondary" onclick="exportAudit()">Export audit JSON</button><button class="secondary" onclick="replay(25);document.querySelector('.replay input').value=25">Lower limit to £25</button></div>`;}
function outro(){return `<div class="eyebrow">Commercial value · B2B2C</div><h2>Safer payments. Less friction.<br>One control layer.</h2><div class="outro"><div class="card"><strong>Who pays</strong><b>Banks, PSPs &amp; wallet providers</b><p class="sub">Institutional subscription and usage fees. Consumer access through partner channels.</p></div><div class="card"><strong>How it scales</strong><b>Shared trust API</b><p class="sub">Partner credentials, policy adapters, decision and audit records.</p></div><div class="card"><strong>What comes next</strong><b>Staff tools · Travel Rule · More assets</b><p class="sub">Test integration, lawful data sharing and controlled model updates.</p></div></div><div class="flow"><div>Customer agent</div><span>→</span><div>TrustBridge</div><span>→</span><div>Financial partners</div><span>↔</span><div>Governance</div></div><p class="note">Success metrics: legitimate completion rate, fraud loss, review time, false positives and operational cost. Commercial benefits remain hypotheses.</p>`;}
function side(){let c=current(),r=rec(),s=r?.state||'idle';let status=c?`<div class="status ${tone(s)}">${pill(s)}<strong>${r?.state==='settled'?'Funds transferred':r?.state==='held'?'Funds reserved':r?.state==='blocked'?'Transfer prevented':r?.state==='rejected'?'Funds returned':'Awaiting decision'}</strong><div class="sub">${c.id} · ${money(c.amount)}</div></div>`:`<div class="status"><span class="pill">SHARED CONTROL</span><strong>${scene===4?'Policy & outcome evidence':scene===5?'Institutional value':'One connected journey'}</strong><div class="sub">Consumer ↔ Trust engine ↔ Financial partner</div></div>`;return `<div class="row"><h3>Live payment state</h3><span class="tiny">SIM · v1.0</span></div>${status}<div class="ledger"><div><small>Available demo funds</small><b>${money(funds-reserved)}</b></div><div><small>Reserved / escrow</small><b>${money(reserved)}</b></div><div><small>Settled to merchants</small><b>${money(paid)}</b></div><div><small>Blocked requests</small><b>${Object.values(records).filter(x=>x.state==='blocked').length}</b></div></div><div class="divider"></div><div class="row"><h3>Audit stream</h3><span class="tiny">${events.length} events</span></div><div class="log">${events.length?events.slice().reverse().map(e=>`<div class="event"><time>${e.t}</time><div><strong>${e.id}</strong> · ${e.msg}</div></div>`).join(''):'<span class="empty">Events appear as transactions are checked.</span>'}</div><div class="note" style="margin-top:auto">Regulatory insight is derived from logged evidence. No actual reporting, live FCA lookup or automated policy deployment.</div>`;}
function replay(v){limit=Number(v);if($('lim'))$('lim').textContent=money(limit);if($('replay-results'))$('replay-results').innerHTML=Object.values(cases).map(c=>{const a=rule(c),b=rule(c,limit);return `<div><b>${c.id} · ${money(c.amount)}</b>${a} → <strong style="color:${b==='BLOCK'?'#b63c46':b==='HOLD'?'#a76412':'#087b60'}">${b}</strong></div>`;}).join('');}function exportAudit(){let data={simulation:true,policy:'v1.0',reviewThreshold:baseline,records,events,ledger:{available:funds-reserved,reserved,paid},hypotheticalReplay:{threshold:limit,decisions:Object.values(cases).map(c=>({id:c.id,baseline:rule(c),proposed:rule(c,limit)}))}};let url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));let a=document.createElement('a');a.href=url;a.download='trustbridge-audit-simulation.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function render(){$('timeline').innerHTML=scenes.map((x,i)=>`<button class="step ${scene===i?'active':''}" onclick="setScene(${i})" aria-current="${scene===i?'step':'false'}"><small>${x[0]}</small><b>${x[1]}</b></button>`).join('');document.querySelectorAll('.tab').forEach(b=>{b.classList.toggle('active',b.dataset.tab===tab);b.setAttribute('aria-selected',b.dataset.tab===tab);});let c=current();$('main').innerHTML=tab==='audit'?audit():scene===0?problem():scene===5?outro():scene===4?audit():tab==='business'?business(c,rec()):consumer(c,rec());$('side').innerHTML=side();$('prev').disabled=scene===0;$('next').disabled=scene===5;replay(limit);}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));$('reset').onclick=reset;$('prev').onclick=()=>setScene(scene-1);$('next').onclick=()=>setScene(scene+1);$('full').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen?.();else document.documentElement.requestFullscreen?.().catch(()=>{});};render();</script></body></html>
